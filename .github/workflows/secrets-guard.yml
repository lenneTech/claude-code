name: Secrets & Client-Data Guard
on:
  push:
  pull_request:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets / client data
        run: bash scripts/scan-secrets.sh --all
      # Check 8 (new proper names next to a customer cue word) only sees added lines, so it runs
      # over the pushed range. It needs no internal denylist, which CI cannot read.
      - name: Scan added lines for customer names (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: bash scripts/scan-secrets.sh --range "${{ github.event.before }}..${{ github.sha }}"
      - name: Scan added lines for customer names (pull request)
        if: github.event_name == 'pull_request'
        run: bash scripts/scan-secrets.sh --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Scanner self-test
        run: bash scripts/__tests__/scan-secrets.test.sh
