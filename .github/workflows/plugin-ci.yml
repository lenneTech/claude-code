name: Plugin CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Windows reports what is red there without blocking until the plugin runs natively.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # Git for Windows defaults to autocrlf=true. Setting it on every OS before the
      # checkout proves .gitattributes keeps scripts LF whatever the client's git config.
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Asks git what it wrote to the working tree (w/crlf) instead of grepping for \r:
      # grep in Git for Windows reported every script as CRLF in the first run.
      - name: Line endings (no CRLF in scripts)
        run: |
          crlf=$(git ls-files --eol -- 'plugins/*.sh' 'plugins/*.mjs' 'scripts/*.sh' '.githooks/*' \
            | grep -E 'w/(crlf|mixed)' || true)
          if [ -n "$crlf" ]; then
            echo "::error::CRLF line endings in:"
            echo "$crlf"
            exit 1
          fi
      # The remaining steps run even when an earlier one fails, so the windows leg shows
      # everything that is red there in one run.
      # One test file per core in parallel, so the step takes about as long as its slowest
      # files rather than their sum (windows-latest: 110 s run one after another). Each file
      # writes to its own log; the logs are printed afterwards in a fixed order, with the
      # file's duration in the group title. Every test file works in its own mktemp directory.
      - name: Bash tests
        if: ${{ !cancelled() }}
        run: |
          logs="$(mktemp -d)"
          find plugins -path '*/__tests__/*.test.sh' | sort > "$logs/list"
          jobs="$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)"
          xargs -P "$jobs" -I{} bash -c '
            log="$1/$(printf %s "$2" | tr / _)"
            start=$SECONDS
            bash "$2" > "$log.out" 2>&1 && rc=0 || rc=$?
            echo "$rc $((SECONDS - start))" > "$log.rc"
          ' _ "$logs" {} < "$logs/list"
          fail=0
          while IFS= read -r t; do
            log="$logs/$(printf %s "$t" | tr / _)"
            rc=1; secs="?"
            [ -r "$log.rc" ] && read -r rc secs < "$log.rc"
            echo "::group::$t (${secs}s)"
            cat "$log.out" 2>/dev/null || echo "no output: the test file did not run"
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then echo "::error file=$t::test failed"; fail=1; fi
          done < "$logs/list"
          exit "$fail"
      - name: Node tests
        if: ${{ !cancelled() }}
        run: node --test $(find plugins -name '*.test.mjs' -not -path '*/node_modules/*' | sort)
      # What a plugin adds to every session (skill listing, agent descriptions) may only grow on
      # purpose: a plugin with a context-budget.json fails here when it outgrows that baseline.
      # Raising it is a visible change to that file (context-budget.mjs --update).
      - name: Context budget
        if: ${{ !cancelled() }}
        run: |
          fail=0
          for baseline in plugins/*/context-budget.json; do
            [ -f "$baseline" ] || continue
            node plugins/lt-dev/scripts/context-budget.mjs "$(dirname "$baseline")" --check --top 5 || fail=1
          done
          exit "$fail"
      - name: Validate plugin manifests
        if: ${{ !cancelled() }}
        run: |
          npm install -g @anthropic-ai/claude-code
          for p in plugins/*/; do claude plugin validate "$p"; done
