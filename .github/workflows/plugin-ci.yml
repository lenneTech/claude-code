name: Plugin CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Windows reports what is red there without blocking until the plugin runs natively.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # Git for Windows defaults to autocrlf=true. Setting it on every OS before the
      # checkout proves .gitattributes keeps scripts LF whatever the client's git config.
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Asks git what it wrote to the working tree (w/crlf) instead of grepping for \r:
      # grep in Git for Windows reported every script as CRLF in the first run.
      - name: Line endings (no CRLF in scripts)
        run: |
          crlf=$(git ls-files --eol -- 'plugins/*.sh' 'plugins/*.mjs' 'scripts/*.sh' '.githooks/*' \
            | grep -E 'w/(crlf|mixed)' || true)
          if [ -n "$crlf" ]; then
            echo "::error::CRLF line endings in:"
            echo "$crlf"
            exit 1
          fi
      # The remaining steps run even when an earlier one fails, so the windows leg shows
      # everything that is red there in one run.
      - name: Bash tests
        if: ${{ !cancelled() }}
        run: |
          fail=0
          while IFS= read -r t; do
            echo "::group::$t"
            bash "$t" || { echo "::error file=$t::test failed"; fail=1; }
            echo "::endgroup::"
          done < <(find plugins -path '*/__tests__/*.test.sh' | sort)
          exit "$fail"
      - name: Node tests
        if: ${{ !cancelled() }}
        run: node --test $(find plugins -name '*.test.mjs' -not -path '*/node_modules/*' | sort)
      - name: Validate plugin manifests
        if: ${{ !cancelled() }}
        run: |
          npm install -g @anthropic-ai/claude-code
          for p in plugins/*/; do claude plugin validate "$p"; done
